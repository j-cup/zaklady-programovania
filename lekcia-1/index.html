<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Robi · Lekcia 1 · Ako fungujú počítače</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Open+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
      <div class="top-actions">
        <span id="counter" class="counter">1 / 1</span>
        <button type="button" id="btn-prev" class="nav-btn">← <span>Späť</span></button>
        <button type="button" id="btn-next" class="nav-btn nav-next"><span>Ďalej</span> →</button>
        <button type="button" id="btn-sound" class="icon-btn" aria-label="Vypnúť zvuk">🔊</button>
        <button type="button" id="btn-full" class="icon-btn" aria-label="Celá obrazovka">⛶</button>
      </div>
    </header>
    <main class="stage" id="stage">
      <div id="slide" class="slide-host"></div>
    </main>
    <footer class="dock">
      <div class="robi-wrap" id="robi-wrap">
        <img id="robi" alt="Robi zdraví" src="obrazky/robi_pozdrav.png" />
      </div>
      <div class="speech" id="speech-box">
        <p id="speech" aria-hidden="true"></p>
      </div>
    </footer>
  </div>
  <p id="speech-sr" class="sr-only" aria-live="polite"></p>
  <div id="toast" class="toast" role="status"></div>
  <script src="js/engine.js"></script>
  <script src="js/game.js"></script>
  <script src="js/presentation.js"></script>
</body>
</html>
